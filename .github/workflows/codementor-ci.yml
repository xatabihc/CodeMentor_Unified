name: CodeMentor checks

on:
  push:
    branches:
      - main
      - development/codementor-3-platform
  pull_request:
    branches:
      - main
      - development/codementor-3-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codementor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lessons-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test lessons, mathematical checks, storage and frontend
        run: bash tools/test.sh

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK and run Android lint
        working-directory: android-studio
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug

      - name: Verify APK contents against lesson sources
        run: python3 tools/check_apk.py android-studio/app/build/outputs/apk/debug/app-debug.apk
